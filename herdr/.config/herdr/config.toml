# Herdr baseline: agent-first, conservative persistence.
onboarding = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[terminal]
new_cwd = "follow"

[keys]
prefix = ";"
previous_tab = "shift+left"
next_tab = "shift+right"
previous_workspace = "shift+up"
next_workspace = "shift+down"
previous_agent = "ctrl+shift+up"
next_agent = "ctrl+shift+down"

[ui]
sidebar_width = 18
sidebar_min_width = 16
sidebar_max_width = 20
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[ui.toast]
# Let the local terminal surface agent-finished / needs-input notifications.
delivery = "terminal"
delay_seconds = 2

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
# Pane text can contain secrets. Agent sessions still resume through integrations.
pane_history = false

[theme]
name = "catppuccin"
auto_switch = false
